<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOKOS — Shop POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Instrument+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --coral:    #fdcec1;
  --coral-mid:#fdaf9a;
  --coral-deep:#f0876a;
  --mint:     #cde6d7;
  --mint-mid: #a8d4bb;
  --apricot:  #fae2d8;
  --lavender: #e3d1e4;
  --sand:     #ffddad;
  --green:    #11483d;
  --green-dk: #0a2e27;
  --cream:    #fffaf7;
  --ink:      #2a1f1a;
  --ink-mid:  #6b4f47;
  --ink-lt:   #a08880;
  --white:    #ffffff;
  --border:   rgba(42,31,26,0.10);
  --shadow:   0 2px 16px rgba(42,31,26,0.08);
  --shadow-lg:0 8px 40px rgba(42,31,26,0.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'Instrument Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* ─── LAYOUT ─── */
#shell {
  display: grid;
  grid-template-columns: 260px 1fr 360px;
  grid-template-rows: 64px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─── TOPBAR ─── */
#topbar {
  grid-column: 1 / -1;
  background: var(--coral);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  border-bottom: 1px solid var(--coral-mid);
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.75rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--green);
}

.logo span {
  font-style: italic;
  font-weight: 300;
  font-size: 1rem;
  letter-spacing: 0.05em;
  color: var(--ink-mid);
  margin-left: 0.5rem;
}

#topbar-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.tab-pill {
  display: flex;
  background: rgba(255,255,255,0.45);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}

.tab-pill button {
  background: none;
  border: none;
  padding: 0.3rem 1rem;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink-mid);
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.18s;
}

.tab-pill button.active {
  background: var(--green);
  color: var(--coral);
}

#wallet-btn {
  background: var(--green);
  color: var(--coral);
  border: none;
  padding: 0.45rem 1.2rem;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: opacity 0.15s;
}
#wallet-btn:hover { opacity: 0.85; }

/* ─── SIDEBAR: MENU ─── */
#sidebar {
  background: var(--cream);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-head {
  padding: 1rem 1rem 0.75rem;
  border-bottom: 1px solid var(--border);
}

#sidebar-head h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--ink-mid);
  font-weight: 400;
}

.cat-strip {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.cat-strip::-webkit-scrollbar { display: none; }

.cat-btn {
  flex-shrink: 0;
  background: var(--apricot);
  border: none;
  padding: 0.3rem 0.9rem;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--ink-mid);
  cursor: pointer;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.cat-btn.active, .cat-btn:hover {
  background: var(--green);
  color: var(--coral);
}

#menu-grid {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  align-content: start;
  scrollbar-width: thin;
}

.menu-item {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.75rem;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
}

.menu-item:hover {
  border-color: var(--coral-mid);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.menu-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--coral);
  border-radius: 12px 12px 0 0;
}

.menu-item[data-cat="scoops"]::before { background: var(--coral); }
.menu-item[data-cat="drinks"]::before { background: var(--mint-mid); }
.menu-item[data-cat="extras"]::before { background: var(--sand); }
.menu-item[data-cat="merch"]::before  { background: var(--lavender); }

.mi-emoji { font-size: 1.4rem; margin-bottom: 0.3rem; display: block; }
.mi-name {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 0.25rem;
}
.mi-price {
  font-size: 0.72rem;
  color: var(--green);
  font-weight: 600;
}

/* ─── CENTER: CART ─── */
#cart-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--apricot);
}

#cart-head {
  padding: 1rem 1.25rem 0.75rem;
  border-bottom: 1px solid rgba(42,31,26,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#cart-head h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem;
  font-style: italic;
  font-weight: 400;
}

#clear-btn {
  background: none;
  border: 1px solid var(--border);
  padding: 0.25rem 0.75rem;
  border-radius: 999px;
  font-family: inherit;
  font-size: 0.7rem;
  color: var(--ink-mid);
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.15s;
}
#clear-btn:hover { border-color: var(--coral-deep); color: var(--coral-deep); }

#cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 0.75rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  scrollbar-width: thin;
}

.cart-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--ink-lt);
  gap: 0.5rem;
}
.cart-empty-icon { font-size: 2.5rem; opacity: 0.4; }
.cart-empty p { font-size: 0.82rem; }

.cart-row {
  background: var(--white);
  border-radius: 10px;
  padding: 0.65rem 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border: 1px solid var(--border);
  animation: slideIn 0.18s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}

.cr-info { flex: 1; }
.cr-name { font-size: 0.82rem; font-weight: 600; }
.cr-price { font-size: 0.72rem; color: var(--ink-mid); }

.cr-qty {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.qty-btn {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--apricot);
  font-size: 0.9rem;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  transition: all 0.12s;
  font-family: inherit;
}
.qty-btn:hover { background: var(--coral); border-color: var(--coral); }
.cr-qty span { font-size: 0.82rem; font-weight: 600; min-width: 18px; text-align: center; }

.cr-total { font-size: 0.82rem; font-weight: 600; color: var(--green); min-width: 48px; text-align: right; }

/* ─── CART FOOTER ─── */
#cart-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid rgba(42,31,26,0.08);
  background: var(--white);
}

.summary-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--ink-mid);
  padding: 0.2rem 0;
}
.summary-row.total {
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  padding-top: 0.5rem;
  margin-top: 0.25rem;
  border-top: 1px solid var(--border);
}

.skoop-equiv {
  background: var(--mint);
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0.75rem 0;
}
.skoop-equiv span:first-child { font-size: 0.72rem; color: var(--green); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.skoop-equiv span:last-child  { font-size: 0.9rem; font-weight: 700; color: var(--green); }

#checkout-btn {
  width: 100%;
  background: var(--green);
  color: var(--coral);
  border: none;
  padding: 0.875rem;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: all 0.18s;
}
#checkout-btn:hover:not(:disabled) { background: var(--green-dk); transform: translateY(-1px); }
#checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── RIGHT: ACTIONS PANEL ─── */
#actions-panel {
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--cream);
}

/* Tabs inside actions */
.action-view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.action-view.active { display: flex; }

/* Rewards send */
#rewards-view {
  padding: 1.25rem;
  gap: 1rem;
}

#rewards-view h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 400;
  color: var(--ink-mid);
}

.scan-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#reward-qr-reader { width: 100%; height: 100%; }

.scan-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  pointer-events: none;
}
.scan-overlay.hidden { display: none; }

.scan-icon { font-size: 2rem; opacity: 0.3; }
.scan-label { font-size: 0.75rem; color: var(--ink-lt); }

.field-group { display: flex; flex-direction: column; gap: 0.4rem; }
.field-label { font-size: 0.72rem; font-weight: 600; color: var(--ink-mid); letter-spacing: 0.05em; text-transform: uppercase; }

.field-input {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  font-family: inherit;
  font-size: 0.88rem;
  color: var(--ink);
  width: 100%;
  transition: border-color 0.15s;
}
.field-input:focus { outline: none; border-color: var(--green); }

.addr-display {
  background: var(--mint);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  font-size: 0.72rem;
  color: var(--green);
  font-weight: 600;
  word-break: break-all;
  min-height: 44px;
}

.action-btn {
  width: 100%;
  border: none;
  padding: 0.75rem;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.18s;
}
.action-btn.primary { background: var(--green); color: var(--coral); }
.action-btn.primary:hover:not(:disabled) { opacity: 0.88; }
.action-btn.secondary { background: var(--apricot); color: var(--ink); border: 1px solid var(--border); }
.action-btn.secondary:hover { background: var(--coral); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Burn panel */
#burn-view {
  padding: 1.25rem;
  gap: 1rem;
  overflow-y: auto;
}

#burn-view h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
  font-weight: 400;
  color: var(--ink-mid);
}

.burn-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
}

.burn-stat {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem;
}
.burn-stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-lt); margin-bottom: 0.25rem; }
.burn-stat-val { font-size: 1rem; font-weight: 700; color: var(--ink); }

.receipt-list { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
.receipt-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.65rem 0.875rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.receipt-card input[type=checkbox] { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
.rc-info { flex: 1; }
.rc-id { font-size: 0.65rem; color: var(--ink-lt); font-family: monospace; }
.rc-amt { font-size: 0.82rem; font-weight: 700; color: var(--green); }

.burn-btn {
  background: #c0392b;
  color: #fff;
  border: none;
  padding: 0.75rem;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: all 0.18s;
  letter-spacing: 0.04em;
}
.burn-btn:hover:not(:disabled) { background: #96281b; }
.burn-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── MODAL: QR CHECKOUT ─── */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(42,31,26,0.55);
  z-index: 100;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
#modal-overlay.open { display: flex; }

#modal {
  background: var(--cream);
  border-radius: 20px;
  width: 460px;
  max-width: 95vw;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.22s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  background: var(--coral);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-style: italic;
  font-weight: 400;
}
.modal-close {
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--ink-mid);
  line-height: 1;
  transition: color 0.12s;
}
.modal-close:hover { color: var(--ink); }

.modal-body { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }

#qr-canvas-wrap {
  background: var(--white);
  border-radius: 16px;
  padding: 1.25rem;
  border: 2px solid var(--coral-mid);
  display: flex;
  align-items: center;
  justify-content: center;
}
#qr-canvas-wrap canvas { display: block; }

.modal-order-summary {
  width: 100%;
  background: var(--white);
  border-radius: 12px;
  padding: 0.875rem 1rem;
  border: 1px solid var(--border);
}

.mos-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  padding: 0.2rem 0;
  color: var(--ink-mid);
}
.mos-row.total {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--ink);
  border-top: 1px solid var(--border);
  padding-top: 0.5rem;
  margin-top: 0.25rem;
}
.mos-row.skoop { color: var(--green); font-weight: 600; }

.modal-status {
  width: 100%;
  background: var(--mint);
  border-radius: 10px;
  padding: 0.65rem 1rem;
  font-size: 0.8rem;
  color: var(--green);
  font-weight: 600;
  text-align: center;
}

.modal-actions { width: 100%; display: flex; gap: 0.75rem; }

/* ─── TOAST ─── */
#toast {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink);
  color: var(--coral);
  padding: 0.65rem 1.25rem;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  z-index: 200;
  transition: transform 0.25s ease;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.success { background: var(--green); color: var(--coral); }
#toast.error { background: #c0392b; color: #fff; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--coral-mid); border-radius: 4px; }
</style>
</head>
<body>

<div id="shell">

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="logo">
      <img id="brand-logo" src="https://raw.githubusercontent.com/KOKOSICECREAM/website/main/Customer_dapp/KOKOS.png" alt="KOKOS" style="height:36px;width:auto;object-fit:contain;vertical-align:middle;">
      <span>shop terminal</span>
    </div>
    <div id="topbar-right">
      <div class="tab-pill">
        <button class="active" onclick="switchPanel('rewards')">Send Rewards</button>
        <button onclick="switchPanel('burn')">Settlement</button>
      </div>
      <button id="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
    </div>
  </header>

  <!-- LEFT: MENU SIDEBAR -->
  <aside id="sidebar">
    <div id="sidebar-head">
      <h2>Menu</h2>
    </div>
    <div class="cat-strip">
      <button class="cat-btn active" onclick="filterCat('all',this)">All</button>
      <button class="cat-btn" onclick="filterCat('scoops',this)">Scoops</button>
      <button class="cat-btn" onclick="filterCat('drinks',this)">Drinks</button>
      <button class="cat-btn" onclick="filterCat('extras',this)">Extras</button>

    </div>
    <div id="menu-grid"></div>
  </aside>

  <!-- CENTER: CART -->
  <main id="cart-panel">
    <div id="cart-head">
      <h2>Order</h2>
      <button id="clear-btn" onclick="clearCart()">Clear all</button>
    </div>
    <div id="cart-items">
      <div class="cart-empty" id="cart-empty">
        <span class="cart-empty-icon">🍦</span>
        <p>Tap menu items to add</p>
      </div>
    </div>
    <div id="cart-footer">
      <div class="summary-row"><span>Subtotal</span><span id="sub-display">$0.00</span></div>
      <div class="summary-row"><span>Tax (9.25%)</span><span id="tax-display">$0.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="total-display">$0.00</span></div>
      <div class="skoop-equiv">
        <span style="display:flex;align-items:center;gap:0.4rem;">
          <img src="https://raw.githubusercontent.com/KOKOSICECREAM/website/main/Customer_dapp/KOKOS_SKOOP.png" alt="SKOOP" style="height:18px;width:18px;object-fit:contain;border-radius:50%;">
          ≈ SKOOP
        </span>
        <span id="skoop-display">—</span>
      </div>
      <button id="checkout-btn" onclick="openCheckout()" disabled>Generate Payment QR</button>
    </div>
  </main>

  <!-- RIGHT: ACTIONS PANEL -->
  <aside id="actions-panel">

    <!-- Send Rewards -->
    <div class="action-view active" id="rewards-view">
      <h3>Send Rewards</h3>

      <!-- Step 1: Scan or paste wallet -->
      <div style="background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;">
        <!-- Camera scanner (hidden until activated) -->
        <div id="reward-qr-reader" style="display:none;width:100%;"></div>
        <!-- Scan button -->
        <button class="action-btn secondary" id="reward-scan-btn" onclick="toggleRewardScan()"
          style="border-radius:0;border:none;border-bottom:1px solid var(--border);width:100%;display:flex;align-items:center;justify-content:center;gap:0.5rem;">
          <span id="scan-btn-icon">📷</span> <span id="scan-btn-label">Scan Customer QR</span>
        </button>
        <!-- Manual paste fallback -->
        <div style="padding:0.65rem 0.875rem;">
          <div style="font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-lt);margin-bottom:0.35rem;">Or paste address</div>

<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const ASSETS = {
  LOGO:  'https://raw.githubusercontent.com/KOKOSICECREAM/website/main/Customer_dapp/KOKOS.png',
  SKOOP: 'https://raw.githubusercontent.com/KOKOSICECREAM/website/main/Customer_dapp/KOKOS_SKOOP.png',
};

const CFG = {
  CHAIN_ID: 8453,
  SKOOP:   '0xfd3ce21c5Acd8BbbE576d0E2336C210C3cEBeb92',
  ESCROW:  '0x85E8cdedAe8ECd23ee21cdc90D75CbAAe9a54991',
  SIGNER:  '0xa22675c629743a126E136a80244ddd2c3b2A4b12',
  SKOOP_DEC: 6,
  TAX_RATE: 0.0925,
  STORE_ID: 'KOKOS_NASHVILLE_01',
  TERMINAL_ID: 'POS_1',
  // Price of SKOOP in USD — update dynamically or via oracle
  SKOOP_PRICE_USD: 0.001, // placeholder — will fetch from pool
};

const ABI_ERC20 = [
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)",
  "function transfer(address,uint256) returns (bool)"
];

const ABI_ESCROW = [
  {
    inputs:[
      {components:[
        {name:"receiptId",type:"bytes32"},
        {name:"orderId",type:"bytes32"},
        {name:"storeIdHash",type:"bytes32"},
        {name:"terminalIdHash",type:"bytes32"},
        {name:"tokenAmount",type:"uint256"},
        {name:"subtotalCents",type:"uint256"},
        {name:"taxCents",type:"uint256"},
        {name:"totalCents",type:"uint256"},
        {name:"itemCount",type:"uint256"},
        {name:"cartHash",type:"bytes32"},
        {name:"deadline",type:"uint256"}
      ],internalType:"struct KOKOSPaymentEscrowPOS.PaymentIntent",name:"intent",type:"tuple"},
      {name:"signature",type:"bytes"}
    ],
    name:"capturePayment",outputs:[],stateMutability:"nonpayable",type:"function"
  },
  {
    inputs:[{name:"receiptIds",type:"bytes32[]"}],
    name:"burnPayments",outputs:[],stateMutability:"nonpayable",type:"function"
  },
  {
    anonymous:false,
    inputs:[
      {indexed:true,name:"receiptId",type:"bytes32"},
      {indexed:true,name:"payer",type:"address"},
      {indexed:false,name:"tokenAmount",type:"uint256"},
      {indexed:false,name:"totalCents",type:"uint256"}
    ],
    name:"PaymentCaptured",type:"event"
  }
];

// ─── MENU DATA ────────────────────────────────────────────────────────────────
const MENU = [
  // Scoops
  { id:'s1', cat:'scoops', emoji:'🍦', name:'Kids Scoop', price:5.00 },
  { id:'s2', cat:'scoops', emoji:'🍧', name:'Small',      price:7.00 },
  { id:'s3', cat:'scoops', emoji:'🍨', name:'Trio',       price:9.00 },
  { id:'s4', cat:'scoops', emoji:'🫙', name:'Pint',       price:12.00 },
  { id:'d1', cat:'drinks', emoji:'☕', name:'Latte',      price:7.00 },
  { id:'d2', cat:'drinks', emoji:'💧', name:'Water',      price:1.00 },
  { id:'e1', cat:'extras', emoji:'🍟', name:'Fries',      price:8.00 },
  { id:'e2', cat:'extras', emoji:'🍦', name:'Cone',       price:0.60 },
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let provider = null, signer = null, signerAddr = null;
let cart = {}; // { itemId: qty }
let capturedReceipts = []; // { receiptId, amount }
let rewardScannerActive = false;
let rewardScanner = null;
let scannedRewardAddr = null;
let activeCat = 'all';
let toastTimer = null;

// ─── WALLET ───────────────────────────────────────────────────────────────────
async function connectWallet() {
  if (!window.ethereum) { showToast('MetaMask not detected', 'error'); return; }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    const network = await provider.getNetwork();
    if (Number(network.chainId) !== CFG.CHAIN_ID) {
      try {
        await provider.send('wallet_switchEthereumChain', [{ chainId: '0x' + CFG.CHAIN_ID.toString(16) }]);
      } catch(e) {
        showToast('Please switch to Base network', 'error'); return;
      }
    }
    signer = await provider.getSigner();
    signerAddr = await signer.getAddress();
    document.getElementById('wallet-btn').textContent = signerAddr.slice(0,6)+'…'+signerAddr.slice(-4);
    showToast('Wallet connected ✓', 'success');
    loadReceipts();
  } catch(e) {
    showToast('Connection failed', 'error');
    console.error(e);
  }
}

// ─── MENU ─────────────────────────────────────────────────────────────────────
function renderMenu() {
  const grid = document.getElementById('menu-grid');
  const items = activeCat === 'all' ? MENU : MENU.filter(i => i.cat === activeCat);
  grid.innerHTML = items.map(item => `
    <div class="menu-item" data-cat="${item.cat}" onclick="addToCart('${item.id}')">
      <span class="mi-emoji">${item.emoji}</span>
      <div class="mi-name">${item.name}</div>
      <div class="mi-price">$${item.price.toFixed(2)}</div>
    </div>
  `).join('');
}

function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu();
}

// ─── CART ─────────────────────────────────────────────────────────────────────
function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  renderCart();
}

function clearCart() {
  cart = {};
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cart-items');
  const empty = document.getElementById('cart-empty');
  const ids = Object.keys(cart);

  if (!ids.length) {
    empty.style.display = 'flex';
    container.querySelectorAll('.cart-row').forEach(r => r.remove());
    updateTotals();
    return;
  }
  empty.style.display = 'none';

  // Remove rows not in cart
  container.querySelectorAll('.cart-row').forEach(r => {
    if (!cart[r.dataset.id]) r.remove();
  });

  ids.forEach(id => {
    const item = MENU.find(m => m.id === id);
    const qty = cart[id];
    const total = item.price * qty;
    let row = container.querySelector(`.cart-row[data-id="${id}"]`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'cart-row';
      row.dataset.id = id;
      container.insertBefore(row, null);
    }
    row.innerHTML = `
      <div class="cr-info">
        <div class="cr-name">${item.emoji} ${item.name}</div>
        <div class="cr-price">$${item.price.toFixed(2)} each</div>
      </div>
      <div class="cr-qty">
        <button class="qty-btn" onclick="changeQty('${id}',-1)">−</button>
        <span>${qty}</span>
        <button class="qty-btn" onclick="changeQty('${id}',1)">+</button>
      </div>
      <div class="cr-total">$${total.toFixed(2)}</div>
    `;
  });

  updateTotals();
}

function updateTotals() {
  const subtotal = Object.entries(cart).reduce((s,[id,qty]) => {
    const item = MENU.find(m => m.id === id);
    return s + (item ? item.price * qty : 0);
  }, 0);
  const tax = subtotal * CFG.TAX_RATE;
  const total = subtotal + tax;
  const skoopAmt = total / CFG.SKOOP_PRICE_USD;

  document.getElementById('sub-display').textContent   = '$' + subtotal.toFixed(2);
  document.getElementById('tax-display').textContent   = '$' + tax.toFixed(2);
  document.getElementById('total-display').textContent = '$' + total.toFixed(2);
  document.getElementById('skoop-display').textContent = Object.keys(cart).length
    ? skoopAmt.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' SKOOP'
    : '—';
  document.getElementById('checkout-btn').disabled = !Object.keys(cart).length;
}

// ─── CHECKOUT / QR ────────────────────────────────────────────────────────────
async function openCheckout() {
  if (!signer) { showToast('Connect wallet first', 'error'); return; }
  if (!Object.keys(cart).length) return;
  document.getElementById('modal-overlay').classList.add('open');
  await generateQR();
}

async function generateQR() {
  const subtotalCents = Math.round(
    Object.entries(cart).reduce((s,[id,qty]) => {
      const item = MENU.find(m => m.id === id);
      return s + (item ? item.price * qty : 0);
    }, 0) * 100
  );
  const taxCents   = Math.round(subtotalCents * CFG.TAX_RATE);
  const totalCents = subtotalCents + taxCents;
  const totalUSD   = totalCents / 100;
  const tokenAmount = BigInt(Math.round(totalUSD / CFG.SKOOP_PRICE_USD * 1e6)); // 6 dec

  const receiptId    = ethers.id('RCPT_' + Date.now() + '_' + Math.random());
  const orderId      = ethers.id('ORD_'  + Date.now());
  const storeIdHash  = ethers.id(CFG.STORE_ID);
  const terminalHash = ethers.id(CFG.TERMINAL_ID);
  const cartItems    = Object.entries(cart).map(([id,q]) => id+':'+q).join(',');
  const cartHash     = ethers.id(cartItems);
  const deadline     = BigInt(Math.floor(Date.now()/1000) + 300); // 5 min

  // Build the digest to sign (match Solidity's _paymentDigest exactly)
  const domain = {
    name: 'KOKOSPaymentEscrowPOS',
    version: '1',
    chainId: CFG.CHAIN_ID,
    verifyingContract: CFG.ESCROW
  };
  const types = {
    PaymentIntent: [
      { name:'receiptId',     type:'bytes32' },
      { name:'orderId',       type:'bytes32' },
      { name:'storeIdHash',   type:'bytes32' },
      { name:'terminalIdHash',type:'bytes32' },
      { name:'tokenAmount',   type:'uint256' },
      { name:'subtotalCents', type:'uint256' },
      { name:'taxCents',      type:'uint256' },
      { name:'totalCents',    type:'uint256' },
      { name:'itemCount',     type:'uint256' },
      { name:'cartHash',      type:'bytes32' },
      { name:'deadline',      type:'uint256' },
    ]
  };
  const value = {
    receiptId, orderId, storeIdHash,
    terminalIdHash: terminalHash,
    tokenAmount,
    subtotalCents: BigInt(subtotalCents),
    taxCents:      BigInt(taxCents),
    totalCents:    BigInt(totalCents),
    itemCount:     BigInt(Object.values(cart).reduce((a,b)=>a+b,0)),
    cartHash,
    deadline
  };

  let signature;
  try {
    signature = await signer.signTypedData(domain, types, value);
  } catch(e) {
    showToast('Signature rejected', 'error');
    closeModal();
    return;
  }

  // Verify the signer matches the authorized POS signer
  const recovered = ethers.verifyTypedData(domain, types, value, signature);
  if (recovered.toLowerCase() !== CFG.SIGNER.toLowerCase()) {
    showToast('⚠️ Wrong signer wallet', 'error');
    closeModal();
    return;
  }

  // Named JSON payload matching customer dapp parseQR() field expectations exactly.
  // Strip 0x from bytes32 values to reduce size — customer dapp restores them.
  const strip = h => h.replace(/^0x/,'');
  const qrPayload = JSON.stringify({
    receiptId:      strip(receiptId),
    orderId:        strip(orderId),
    storeIdHash:    strip(storeIdHash),
    terminalIdHash: strip(terminalHash),
    tokenAmount:    tokenAmount.toString(),
    subtotalCents,
    taxCents,
    totalCents,
    itemCount:      Object.values(cart).reduce((a,b)=>a+b,0),
    cartHash:       strip(cartHash),
    deadline:       deadline.toString(),
    signature,
  });

  console.log('QR payload chars:', qrPayload.length);

  // Generate QR — pure black on white for maximum camera contrast
  const wrap = document.getElementById('qr-canvas-wrap');
  wrap.innerHTML = '';
  try {
    new QRCode(wrap, {
      text: qrPayload,
      width: 320,
      height: 320,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });
    // Force img to display block immediately (qrcodejs quirk)
    setTimeout(() => {
      const img = wrap.querySelector('img');
      const canvas = wrap.querySelector('canvas');
      if (img) { img.style.display = 'block'; img.style.width = '320px'; img.style.height = '320px'; }
      if (canvas) { canvas.style.display = 'block'; }
    }, 50);
  } catch(qrErr) {
    console.error('QR gen error:', qrErr);
    showToast('QR error: ' + qrErr.message, 'error');
    closeModal();
    return;
  }

  // Summary
  const items = Object.entries(cart).map(([id,q]) => {
    const it = MENU.find(m=>m.id===id);
    return `<div class="mos-row"><span>${it.emoji} ${it.name} ×${q}</span><span>$${(it.price*q).toFixed(2)}</span></div>`;
  }).join('');

  document.getElementById('modal-summary').innerHTML = `
    ${items}
    <div class="mos-row"><span>Tax</span><span>$${(taxCents/100).toFixed(2)}</span></div>
    <div class="mos-row total"><span>Total</span><span>$${(totalCents/100).toFixed(2)}</span></div>
    <div class="mos-row skoop"><span style="display:flex;align-items:center;gap:0.35rem;"><img src="https://raw.githubusercontent.com/KOKOSICECREAM/website/main/Customer_dapp/KOKOS_SKOOP.png" alt="SKOOP" style="height:15px;width:15px;object-fit:contain;border-radius:50%;">≈ SKOOP</span><span>${Number(tokenAmount).toLocaleString()} SKOOP</span></div>
  `;

  document.getElementById('modal-status').textContent = 'Waiting for customer to scan…';

  // Poll for PaymentCaptured event
  pollForPayment(receiptId);
}

async function regenerateQR() {
  document.getElementById('qr-canvas-wrap').style.opacity = '0.4';
  await generateQR();
  document.getElementById('qr-canvas-wrap').style.opacity = '1';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

async function pollForPayment(receiptId) {
  if (!provider) return;
  const escrow = new ethers.Contract(CFG.ESCROW, ABI_ESCROW, provider);
  const filter = escrow.filters.PaymentCaptured(receiptId);
  const startBlock = await provider.getBlockNumber();
  let attempts = 0;
  const poll = setInterval(async () => {
    attempts++;
    if (attempts > 60) { clearInterval(poll); return; } // 5 min
    try {
      const events = await escrow.queryFilter(filter, startBlock - 2);
      if (events.length > 0) {
        clearInterval(poll);
        document.getElementById('modal-status').textContent = '✓ Payment confirmed!';
        document.getElementById('modal-status').style.background = 'var(--mint)';
        showToast('Payment received ✓', 'success');
        cart = {};
        renderCart();
        setTimeout(closeModal, 2500);
        loadReceipts();
      }
    } catch {}
  }, 5000);
}

// ─── REWARDS / SEND ───────────────────────────────────────────────────────────
function switchPanel(panel) {
  document.querySelectorAll('.action-view').forEach(v => v.classList.remove('active'));
  document.getElementById(panel+'-view').classList.add('active');
  document.querySelectorAll('.tab-pill button').forEach((b,i) => {
    b.classList.toggle('active', (panel==='rewards'&&i===0)||(panel==='burn'&&i===1));
  });
}

function setRewardAddr(addr) {
  scannedRewardAddr = addr;
  document.getElementById('reward-addr').textContent = addr;
  document.getElementById('reward-addr-input').value = addr;
  // Enable send if amount also filled
  const amt = document.getElementById('reward-amount').value;
  document.getElementById('reward-send-btn').disabled = !(addr && Number(amt) > 0);
}

function onRewardAddrInput(val) {
  const addr = val.trim().replace(/^ethereum:/i,'');
  if (ethers.isAddress(addr)) {
    setRewardAddr(addr);
  } else {
    scannedRewardAddr = null;
    document.getElementById('reward-addr').textContent = '—';
    document.getElementById('reward-send-btn').disabled = true;
  }
}

async function pasteAddr() {
  try {
    const text = await navigator.clipboard.readText();
    const addr = text.trim().replace(/^ethereum:/i,'');
    if (ethers.isAddress(addr)) {
      setRewardAddr(addr);
      showToast('Address pasted ✓', 'success');
    } else {
      showToast('Not a valid address', 'error');
    }
  } catch {
    showToast('Clipboard access denied', 'error');
  }
}

function toggleRewardScan() {
  if (rewardScannerActive) {
    stopRewardScan();
  } else {
    startRewardScan();
  }
}

function startRewardScan() {
  const reader = document.getElementById('reward-qr-reader');
  reader.style.display = 'block';
  document.getElementById('scan-btn-label').textContent = 'Stop Camera';
  document.getElementById('scan-btn-icon').textContent = '⏹';
  rewardScannerActive = true;

  rewardScanner = new Html5Qrcode('reward-qr-reader');
  rewardScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 180, height: 180 } },
    (decoded) => {
      const addr = decoded.trim().replace(/^ethereum:/i,'');
      if (ethers.isAddress(addr)) {
        setRewardAddr(addr);
        stopRewardScan();
        showToast('Wallet scanned ✓', 'success');
      } else {
        showToast('Not a valid wallet QR', 'error');
      }
    },
    () => {}
  ).catch(() => {
    showToast('Camera access denied — use paste instead', 'error');
    stopRewardScan();
  });
}

function stopRewardScan() {
  if (rewardScanner) {
    rewardScanner.stop().catch(()=>{});
    rewardScanner = null;
  }
  rewardScannerActive = false;
  document.getElementById('reward-qr-reader').style.display = 'none';
  document.getElementById('scan-btn-label').textContent = 'Scan Customer QR';
  document.getElementById('scan-btn-icon').textContent = '📷';
}

function resetRewards() {
  stopRewardScan();
  scannedRewardAddr = null;
  document.getElementById('reward-addr').textContent = '—';
  document.getElementById('reward-addr-input').value = '';
  document.getElementById('reward-amount').value = '';
  document.getElementById('reward-send-btn').disabled = true;
}

// Enable send button when amount is typed (if addr already set)
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('reward-amount').addEventListener('input', (e) => {
    document.getElementById('reward-send-btn').disabled =
      !(scannedRewardAddr && Number(e.target.value) > 0);
  });
});

async function sendReward() {
  if (!signer) { showToast('Connect wallet first', 'error'); return; }
  if (!scannedRewardAddr) { showToast('No wallet address set', 'error'); return; }
  const amtStr = document.getElementById('reward-amount').value;
  if (!amtStr || Number(amtStr) <= 0) { showToast('Enter SKOOP amount', 'error'); return; }

  const amount = ethers.parseUnits(amtStr, CFG.SKOOP_DEC);
  const btn = document.getElementById('reward-send-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const token = new ethers.Contract(CFG.SKOOP, ABI_ERC20, signer);
    const tx = await token.transfer(scannedRewardAddr, amount);
    showToast('Broadcasting…', '');
    await tx.wait();
    showToast('Reward sent ✓', 'success');
    resetRewards();
    btn.textContent = 'Send SKOOP Reward';
  } catch(e) {
    showToast('Transaction failed', 'error');
    console.error(e);
    btn.disabled = false;
    btn.textContent = 'Send SKOOP Reward';
  }
}

// ─── SETTLEMENT / BURN ────────────────────────────────────────────────────────
async function loadReceipts() {
  if (!provider) return;
  const escrow = new ethers.Contract(CFG.ESCROW, ABI_ESCROW, provider);
  const filter = escrow.filters.PaymentCaptured();
  try {
    const events = await escrow.queryFilter(filter, -50000);
    capturedReceipts = events.map(e => ({
      receiptId: e.args.receiptId,
      amount: e.args.tokenAmount
    }));
    renderReceipts();
  } catch(e) {
    console.error('loadReceipts', e);
  }
}

function renderReceipts() {
  const list = document.getElementById('receipt-list');
  document.getElementById('stat-captured').textContent = capturedReceipts.length;
  const totalSkoop = capturedReceipts.reduce((s,r) => s + Number(ethers.formatUnits(r.amount, CFG.SKOOP_DEC)), 0);
  document.getElementById('stat-skoop').textContent = totalSkoop.toLocaleString('en-US', { maximumFractionDigits:0 });

  if (!capturedReceipts.length) {
    list.innerHTML = '<p style="font-size:0.78rem;color:var(--ink-lt);text-align:center;padding:1rem 0;">No captured receipts yet</p>';
    document.getElementById('burn-btn').disabled = true;
    return;
  }

  list.innerHTML = capturedReceipts.map((r,i) => `
    <div class="receipt-card">
      <input type="checkbox" id="rc-${i}" value="${r.receiptId}" onchange="updateBurnBtn()">
      <div class="rc-info">
        <div class="rc-id">${r.receiptId.slice(0,18)}…</div>
        <div class="rc-amt">${parseFloat(ethers.formatUnits(r.amount,CFG.SKOOP_DEC)).toLocaleString()} SKOOP</div>
      </div>
    </div>
  `).join('');
}

function updateBurnBtn() {
  const any = document.querySelectorAll('#receipt-list input:checked').length > 0;
  document.getElementById('burn-btn').disabled = !any;
}

async function burnSelected() {
  if (!signer) { showToast('Connect wallet first', 'error'); return; }
  const checked = [...document.querySelectorAll('#receipt-list input:checked')].map(c => c.value);
  if (!checked.length) return;

  const btn = document.getElementById('burn-btn');
  btn.disabled = true;
  btn.textContent = 'Burning…';

  try {
    const escrow = new ethers.Contract(CFG.ESCROW, ABI_ESCROW, signer);
    const tx = await escrow.burnPayments(checked);
    showToast('Broadcasting burn…', '');
    await tx.wait();
    showToast(`🔥 ${checked.length} receipt(s) burned`, 'success');
    await loadReceipts();
  } catch(e) {
    showToast('Burn failed', 'error');
    console.error(e);
  }

  btn.textContent = '🔥 Burn Selected';
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderMenu();
renderCart();

// Auto-connect if already authorized
if (window.ethereum) {
  window.ethereum.request({ method:'eth_accounts' }).then(accounts => {
    if (accounts.length) connectWallet();
  }).catch(()=>{});
}
</script>
